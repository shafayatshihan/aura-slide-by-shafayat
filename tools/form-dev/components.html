<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>components harness</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  /* Dev harness: the 1600x900 stage with the real regions, so each component is tested at its true size. */
  #h-stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--bg);overflow:hidden}
  .h-region{position:absolute;outline:1px dashed rgba(146,129,176,.45);outline-offset:2px}
  #h-left{left:96px;top:120px;width:344px;height:730px;display:flex;flex-direction:column;align-items:flex-start}
  #h-left .badge{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:100px;background:var(--pill);font-size:15px}
  #h-left h1{margin-top:16px;font-family:var(--head);font-weight:900;font-size:46px;line-height:1.1}
  #h-left .lead{margin-top:16px;font-size:19px;line-height:1.45;color:var(--mute)}
  #h-slot{position:relative;margin-top:26px;width:344px;flex:1;min-height:0;display:flex;flex-direction:column;gap:18px}
  #h-illus{left:470px;top:70px;width:660px;height:390px}
  #h-right{left:1160px;top:120px;width:344px;height:640px}
  #h-stage[data-c=workshop] #h-right{height:730px}
  #h-stage:not([data-c=workshop]) #h-slot{display:none}
  #h-char{position:absolute;left:300px;top:337px;width:1000px;height:563px;opacity:.5;pointer-events:none}
  #h-char video{width:100%;height:100%;object-fit:cover}
  #h-bar{position:absolute;left:96px;top:40px;display:flex;gap:8px;z-index:9;flex-wrap:wrap;width:1060px}
  #h-bar button{height:32px;padding:0 12px;border-radius:100px;background:var(--pill);font-size:13px}
  #h-bar button.on{background:var(--ink);color:var(--pill)}
  #h-state{position:absolute;right:96px;top:40px;width:360px;font:12px/1.35 Consolas,monospace;color:var(--mute);white-space:pre-wrap;z-index:9;
    max-height:70px;overflow:hidden}
</style>
</head>
<body>
<div id="h-stage">
  <div id="h-char"><video src="/assets/character.mp4" muted playsinline preload="auto"></video></div>
  <div id="h-bar"></div>
  <pre id="h-state"></pre>
  <div id="h-left" class="h-region"><span class="badge" id="h-badge">your files</span><h1 id="h-head">got a report?</h1>
    <p class="lead" id="h-lead">drop your thesis or report here.</p><div id="h-slot"></div></div>
  <div id="h-illus" class="h-region"></div>
  <div id="h-right" class="h-region"></div>
</div>
<script type="module">
import { bus, on } from '/js/bus.js';
import * as api from '/js/api.js';

const $ = s => document.querySelector(s);
const stage = $('#h-stage');
const fit = () => { const s = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = `scale(${s})`; };
addEventListener('resize', fit); fit();

// state store like app.js (dotted keys)
const data = JSON.parse(sessionStorage.getItem('h-state') || '{"look":{"theme":"Claude chooses"}}');
const getState = () => data;
function setKey(key, value, opts = {}) {
  const ks = key.split('.'); let o = data;
  for (const k of ks.slice(0, -1)) o = (o[k] && typeof o[k] === 'object') ? o[k] : (o[k] = {});
  o[ks[ks.length - 1]] = value;
  window.__setKeys.push({ key, value, touch: opts.touch !== false });
  sessionStorage.setItem('h-state', JSON.stringify(data));
  paintState();
}
const paintState = () => { $('#h-state').textContent = JSON.stringify({ files: data.files, look: data.look }, null, 0); };

// audio: the real module if present, always recorded for tests
window.__sfx = []; window.__events = []; window.__setKeys = [];
let real = null;
try { real = (await import('/js/audio.js')).audio; } catch (e) { real = null; }
const audio = { sfx: n => { window.__sfx.push(n); try { real && real.sfx(n); } catch (e) {} }, start: () => real && real.start(), state: () => ({ music: false, sfx: true }) };
addEventListener('pointerdown', () => { try { real && real.start(); real && real.setMusic && real.setMusic(false); } catch (e) {} }, { once: true });
for (const t of ['files:dragover', 'files:dragleave', 'files:drop', 'files:uploaded', 'files:removed', 'look:change', 'claude:event', 'claude:state'])
  on(t, d => window.__events.push({ type: t, detail: d }));

const FOLDERS = { Report: ['your report', 'pdf or word', '.pdf,.doc,.docx'], 'Images and photos': ['photos and pictures', 'jpg, png, heic, svg', 'image/*,.heic'],
  'Anything else': ['anything else', 'any file', ''] };
let comp = null;
async function mount(c, folder = 'Report') {
  if (comp) { comp.destroy(); comp = null; }
  stage.dataset.c = c;
  [...$('#h-bar').children].forEach(b => b.classList.toggle('on', b.dataset.k === `${c}:${folder}` || (c !== 'uploads' && b.dataset.k === c)));
  $('#h-slot').replaceChildren(); $('#h-right').replaceChildren(); $('#h-illus').replaceChildren();
  if (c === 'uploads') {
    const [title, hint, accept] = FOLDERS[folder];
    $('#h-badge').textContent = 'your files'; $('#h-head').textContent = folder === 'Report' ? 'got a report?' : 'any photos or pictures?';
    $('#h-lead').textContent = 'drop it here. claude reads it first.';
    const m = await import('/js/uploads.js');
    comp = m.mountUploads($('#h-right'), { folder, title, hint, accept, setKey, getState, bus, audio });
  } else if (c === 'looks') {
    $('#h-badge').textContent = 'the look'; $('#h-head').textContent = 'pick a look'; $('#h-lead').textContent = 'hover to preview. claude follows it.';
    const m = await import('/js/looks.js');
    const slot = document.createElement('div'); slot.className = 'illus-slot'; $('#h-illus').append(slot);
    comp = m.mountLooks($('#h-right'), slot, { getState, setKey, bus, audio });
  } else {
    $('#h-badge').textContent = 'make it'; $('#h-head').textContent = 'claude is making your slides';
    $('#h-lead').textContent = 'this takes a little while. if claude asks something, answer on the right.';
    const m = await import('/js/workshop.js');
    comp = m.mountWorkshop($('#h-slot'), $('#h-right'), { getState, bus, audio });
  }
  window.__comp = comp;
  paintState();
}
on('claude:state', d => {
  if (stage.dataset.c !== 'workshop') return;
  $('#h-head').textContent = d.done ? 'your slides are ready!' : d.waiting ? 'claude has a question' : 'claude is making your slides';
});
const bar = $('#h-bar');
const add = (label, k, fn) => { const b = document.createElement('button'); b.textContent = label; b.dataset.k = k; b.onclick = fn; bar.append(b); };
add('uploads: Report', 'uploads:Report', () => mount('uploads', 'Report'));
add('uploads: Images', 'uploads:Images and photos', () => mount('uploads', 'Images and photos'));
add('looks', 'looks', () => mount('looks'));
add('workshop', 'workshop', () => mount('workshop'));
add('start fake run', 'x', async () => { await api.claude.start(); mount('workshop'); });
add('remount', 'y', () => mount(stage.dataset.c || 'uploads', (bar.querySelector('.on') || {}).dataset?.k?.split(':')[1] || 'Report'));
add('destroy', 'z', () => { comp && comp.destroy(); comp = null; });
window.__mount = mount;

const q = new URLSearchParams(location.search);
mount(q.get('c') || 'uploads', q.get('folder') || 'Report');
</script>
</body>
</html>
